jaroscope:
  target-release: 21
  cache:
    directory: "~/.jaroscope/cache"
    max-age: 30d
    max-size: 2GiB
  security:
    banned-roots: []
  response:
    max-source-size: 1MiB
    max-jar-resource-size: 1MiB
  background-decompilation:
    enabled: true
    max-concurrent-jars: 2
    max-classes: 10000
  archive:
    max-size: 1GiB
    max-entries: 100000
    max-class-size: 64MiB
    max-expanded-class-size: 2GiB
  decompiler:
    max-concurrent-runs: 2
    threads-per-run: 2
